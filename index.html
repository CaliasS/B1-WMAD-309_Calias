<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kill the Cockroaches!</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2f7a3e" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <h1>Kill the Cockroaches!</h1>
  <div id="offlineWarning">You are offline!</div>
  <div id="info">
    <div><span id="timer">0</span> sec</div>
    <div><span id="kills">0</span> kills</div>
    <button id="soundToggle">🔊</button>
  </div>
  <div id="game"></div>
  <button id="installBtn" style="display:none;">Install Game</button>

  <audio id="bgMusic" src="background.mp3" loop></audio>
  <audio id="killSound" src="squash.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
